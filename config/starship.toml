"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a7c080)\
${custom.ssh}\
${custom.local_folder}\
$directory\
[](fg:#414b50 bg:#374145)\
$git_branch\
$git_status\
[](fg:#374145 bg:#2e383c)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[ ](fg:#2e383c)\
\n$character"""

[directory]
style = "fg:#8fc9a0 bg:#414b50"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#374145"
format = '[[ $symbol $branch ](fg:#dbbc7f bg:#374145)]($style)'

[git_status]
style = "bg:#374145"
format = '[[($all_status$ahead_behind )](fg:#dbbc7f bg:#374145)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#374145"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:#dbbc7f bg:#374145)]($style)'

[jj_status]
style = "bg:#374145"
format = '[[($all )](fg:#dbbc7f bg:#374145)]($style)'

[nodejs]
symbol = ""
style = "bg:#2e383c"
format = '[[ $symbol ($version) ](fg:#e69875 bg:#2e383c)]($style)'

[bun]
symbol = ""
style = "bg:#2e383c"
format = '[[ $symbol ($version) ](fg:#e69875 bg:#2e383c)]($style)'

[rust]
symbol = ""
style = "bg:#2e383c"
format = '[[ $symbol ($version) ](fg:#e69875 bg:#2e383c)]($style)'

[golang]
symbol = ""
style = "bg:#2e383c"
format = '[[ $symbol ($version) ](fg:#e69875 bg:#2e383c)]($style)'

[php]
symbol = ""
style = "bg:#2e383c"
format = '[[ $symbol ($version) ](fg:#e69875 bg:#2e383c)]($style)'

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#2e383c"
format = '[[  $time ](fg:#dcd3bc bg:#2e383c)]($style)'

[os]
style = "bg:#a7c080 fg:#272e33"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = ""
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[custom.ssh]
when = 'test -n "$SSH_CONNECTION$SSH_CLIENT$SSH_TTY"'
command = 'printf "%s@%s" "$(id -un)" "$(hostname -s)"'
shell = ['sh']
format = '[ $output ](bg:#a7c080 fg:#272e33)[](fg:#a7c080 bg:#414b50)'

[custom.local_folder]
when = 'test -z "$SSH_CONNECTION$SSH_CLIENT$SSH_TTY"'
format = '[ 󰉋 ](bg:#a7c080 fg:#272e33)[](fg:#a7c080 bg:#414b50)'
shell = ['sh']
